<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&family=VT323&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* VOICE  occasion, hushed: a night-shift game that stays quiet
   IDEA   a 1-bit engraving of a night radio booth, as if printed on the station's own thermal fax paper
   PICTURE full-screen 3D booth rendered in two colours: world-locked ordered dither, crisp outlines, big pixels
   COLOUR exactly two colours from the chosen palette (default: fax ink on thermal paper); 50% dither patterns stand in for grey
   TYPE   Noto Serif TC for spoken lines, Noto Sans TC for labels, VT323 for numbers, LXGW WenKai TC for handwriting
   LAYOUT the scene fills the screen; a thin HUD and the next step on top; subtitles and choices at the bottom */
:root{color-scheme:dark;--d:#3d4859;--l:#ece6d5;
--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB",var(--serif);--px:"VT323","Courier New",monospace}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--d);color:var(--l);font:16px/1.6 var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:2px dashed var(--l);outline-offset:2px}
[hidden]{display:none!important}
.dith{background-image:repeating-conic-gradient(var(--d) 0 25%,transparent 0 50%);background-size:4px 4px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
body.flat #gl{display:none}
body.flat{background:var(--d)}
.box{background:var(--d);border:2px solid var(--l);box-shadow:3px 3px 0 var(--d)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:860px;margin:0 auto}
#hud > *{pointer-events:auto}
.h-row{display:flex;align-items:stretch;gap:6px}
.pill{display:flex;align-items:center;gap:7px;background:var(--d);border:2px solid var(--l);padding:2px 9px;white-space:nowrap}
#h-night{font:600 16px var(--serif)}
#h-clock,#h-mv,#h-tv{font:22px/1 var(--px);letter-spacing:.04em}
.hs{font-size:13px;margin-left:2px;padding-left:8px;border-left:2px solid var(--l)}
#h-wx{align-self:flex-start;display:flex;flex-wrap:wrap;gap:0 11px;font-size:13px;line-height:1.6;padding:0 8px;background:var(--d);border:1px dashed var(--l)}
#h-wx .vis b{font-weight:400;margin-left:5px;padding:0 5px;background:var(--l);color:var(--d)}
#h-wx[data-e="3"],#h-wx[data-e="4"]{animation:jit 2.6s steps(1,end) infinite}
@keyframes jit{0%,92%{transform:none}93%{transform:translateX(2px)}96%{transform:translateX(-1px)}}
#toast2{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 206px);right:max(12px,env(safe-area-inset-right,0px));font:20px/1 var(--px);background:var(--d);color:var(--l);border:2px solid var(--l);padding:5px 10px;opacity:0;pointer-events:none}
#toast2 b,#toast2 span{font-weight:400}
#toast2.go{animation:toast 3.2s steps(1,end) both}
#toast3{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 244px);right:max(12px,env(safe-area-inset-right,0px));font:17px/1 var(--sans);background:var(--d);color:var(--l);border:2px dashed var(--l);padding:5px 10px;opacity:0;pointer-events:none}
#toast3 b{font-weight:400;padding:0 5px;background:var(--l);color:var(--d)}
#toast3.go{animation:toast 3.2s steps(1,end) both}
.lgp li.okl{color:color-mix(in srgb,var(--d) 70%,transparent)}
.tick{font:13px var(--hand);font-style:normal;margin-left:.4em;color:var(--d);opacity:.8;white-space:nowrap}
.pk .okb{border-style:dashed}
#card.c-stamp{background-image:repeating-conic-gradient(var(--d) 0 25%,transparent 0 50%)}
.stampc{position:relative;background:var(--l);color:var(--d);border:2px solid var(--d);outline:2px solid var(--l);box-shadow:8px 8px 0 var(--d);padding:18px 18px 14px;font:17px/1.7 var(--hand)}
.stampc .seal{position:absolute;right:14px;top:10px;width:84px;height:84px;display:grid;place-items:center;font:600 46px/1 var(--serif);color:#c4382a;border:5px double #c4382a;border-radius:6px;transform:rotate(-9deg);animation:slam .5s steps(5,end) both;animation-delay:.28s;mix-blend-mode:multiply}
@keyframes slam{0%{opacity:0;transform:rotate(-9deg) scale(3)}60%{opacity:1;transform:rotate(-9deg) scale(.92)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
.stampc .tri{list-style:none;margin:0 96px 6px 0;padding:0}
.stampc .tri li{padding:3px 0}
.stampc .tri em{font:12px var(--sans);font-style:normal;margin-left:8px;color:#a1281c}
.stampc .nr{font:13px var(--sans);margin:12px 0 4px;padding-top:8px;border-top:2px dotted var(--d)}
.stampc .newrows{list-style:none;margin:0;padding:0}
.stampc .newrows b{font:600 15px var(--serif)}
.stampc .newrows p{margin:0 0 8px}
body.shake #gl,body.shake #card .stampc{animation:shake .45s steps(6,end)}
@keyframes shake{0%{transform:translate(0,0)}17%{transform:translate(-5px,3px)}33%{transform:translate(4px,-2px)}50%{transform:translate(-3px,2px)}67%{transform:translate(2px,-1px)}83%{transform:translate(-1px,1px)}100%{transform:none}}
#h-sky,#h-tier,#h-m span{font-size:13px}
#h-tier{font-style:normal}
#h-m[data-tier=murky] #h-tier,#h-m[data-tier=tideline] #h-tier{text-decoration:underline wavy;text-underline-offset:3px}
.h-btns{margin-left:auto;display:flex;gap:6px}
.h-btns button{min-height:36px;padding:0 10px;border:2px solid var(--l);background:var(--d);font-size:13px;white-space:nowrap}
.h-btns button:active,.pill:active{background:var(--l);color:var(--d)}
#snd[aria-pressed=false]{text-decoration:line-through}
#goal{display:block;width:100%;text-align:left;border:2px solid var(--l);background:var(--d);padding:6px 12px 7px;box-shadow:4px 4px 0 var(--d)}
#goal .gl{display:inline-block;font-size:13px;background:var(--l);color:var(--d);padding:0 6px;margin-right:8px;animation:pulse 1.6s steps(2) infinite}
@keyframes pulse{50%{background:var(--d);color:var(--l);box-shadow:inset 0 0 0 1px var(--l)}}
#goal-t{font-size:15.5px}
#goal-tip{display:block;font-size:13px;margin-top:2px}
#goal-tip:empty{display:none}
body.busy #goal{display:none}
#h-tasks{display:inline-flex;flex-wrap:wrap;gap:2px 11px;font-size:13px;padding:2px 8px;background:var(--d);align-self:flex-start}
.tk{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tk i{width:8px;height:8px;border:1px solid var(--l)}
.tk.done i{background:var(--l)}

/* subtitles */
#sub{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(720px,calc(100% - 24px));background:var(--d);border:2px solid var(--l);box-shadow:5px 5px 0 var(--d);padding:10px 16px 14px}
#sub-who{display:inline-block;font-size:13px;background:var(--l);color:var(--d);padding:0 6px;margin-bottom:4px}
#sub-who:empty{display:none}
#sub-t{font:17px/1.85 var(--serif);min-height:1.85em;text-align:justify}
#sub.amb{border-style:dashed;box-shadow:none}
#sub.amb #sub-t{font-size:15.5px}
#sub-more{position:absolute;right:12px;bottom:6px;font-style:normal;font-size:13px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#skip{position:absolute;right:-2px;top:-42px;min-height:34px;padding:0 12px;border:2px solid var(--l);background:var(--d);font-size:13px}
#sub-t button{margin-top:10px;min-height:44px;padding:0 16px;border:2px solid var(--l);background:var(--d);font:16px var(--sans)}
#sub-t #again{background:var(--l);color:var(--d)}

/* choices */
#choices{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(560px,calc(100% - 24px));display:grid;gap:7px}
#choices .q{margin:0;justify-self:start;font-size:13px;background:var(--l);color:var(--d);padding:0 6px}
.opt{min-height:48px;text-align:left;padding:8px 16px;border:2px solid var(--l);background:var(--d);box-shadow:4px 4px 0 var(--d);font-size:16px}
.opt:hover,.opt:active{background:var(--l);color:var(--d)}

/* paper close-ups: the 50% dither dims the room behind */
#card{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 64px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);background-image:repeating-conic-gradient(var(--d) 0 25%,transparent 0 50%);background-size:4px 4px}
#card.c-log,#card.c-air{background:none}
#card .paper{width:min(460px,100%);max-height:100%;overflow:auto}
.card-hint{margin:0;font-size:13px;background:var(--d);padding:0 8px}
.card-hint:empty{display:none}
.fax,.letter,.note,.logent{background:var(--l);color:var(--d);border:2px solid var(--d);outline:2px solid var(--l);box-shadow:8px 8px 0 var(--d)}
.fax{font:14px/1.65 var(--sans);padding:14px 16px 18px;animation:feed 1.4s steps(14,end) both}
@keyframes feed{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.fx-top{display:flex;justify-content:space-between;font-size:13px}
.fx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:17px;margin:2px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--d)}
.fx-h span{font-weight:400;font-size:13px}
.fx-d{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:1px 8px;margin:0 0 8px;font-size:13.5px}
.fx-d dd{margin:0}
.fx-rows{list-style:none;margin:0;padding:6px 0;border-top:2px dotted var(--d);border-bottom:2px dotted var(--d)}
.fx-rows li{display:grid;grid-template-columns:1.3em 4.4em minmax(0,1fr);gap:6px;padding:2px 0}
.fx-rows b{font-weight:400}
.fx-rows .z{font-weight:700}
.fx-rows .x span,.rd .x span{white-space:nowrap;margin-right:.9em}
.fx-sp{margin-top:8px;font-size:13.5px}
.fx-sp span,.fx-sg span{margin-right:10px}
.fx-sg{text-align:right;margin-top:6px;font-size:13.5px}
.fx-sg b{display:inline-block;min-width:3.5em;font-weight:500;text-align:left}
.fx-x{margin-top:8px;font-size:13.5px}
.fx-cut{border-top:2px dotted var(--d);margin:16px -16px 12px}
.letter{font:18px/1.85 var(--hand);padding:18px 20px;animation:unfold .6s steps(6,end) both}
@keyframes unfold{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.letter p{margin:0 0 6px}
.lf,.letter .lt{font:13.5px/1.7 var(--sans)}
.lf{margin-bottom:6px;border-bottom:1px solid var(--d)}
.letter .lt{margin-top:8px}
.air{background:var(--d);border:2px solid var(--l);box-shadow:6px 6px 0 var(--d);padding:10px 16px 10px}
.air p{font:15.5px/1.75 var(--serif);margin:0 0 3px}
.air p span{font-weight:600}
.air p.slow{letter-spacing:.3em}
.al{display:inline-flex;align-items:center;gap:7px;font-size:13px;background:var(--l);color:var(--d);padding:0 6px;margin-bottom:6px}
.al i{width:8px;height:8px;background:var(--d);animation:blink .8s steps(2) infinite}
.logent,.note{background-image:repeating-linear-gradient(transparent 0 29px,var(--d) 29px 30px);background-color:var(--l);font:18px/30px var(--hand);padding:6px 16px 8px}
.logent p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;animation:write 1s steps(18,end) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.logent .lt{font:13px/30px var(--sans)}
.note{font-size:17px}

/* night title, toast, arrow, label, lightning */
#ntitle{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
#ntitle b{font:600 clamp(40px,11vw,60px)/1.1 var(--serif);letter-spacing:.06em;background:var(--d);padding:4px 22px;border:2px solid var(--l)}
#ntitle span{font-size:15px;background:var(--d);padding:0 10px}
#ntitle.go{animation:ntitle 2.4s steps(1,end) both}
@keyframes ntitle{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
#toast{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 168px);right:max(12px,env(safe-area-inset-right,0px));font:20px/1 var(--px);background:var(--l);color:var(--d);border:2px solid var(--d);padding:5px 10px;opacity:0;pointer-events:none}
#toast b,#toast span{font-weight:400}
#toast.go{animation:toast 3.2s steps(1,end) both}
@keyframes toast{0%{opacity:0}5%,80%{opacity:1}100%{opacity:0}}
#arrow{position:fixed;z-index:4;top:50%;transform:translateY(-50%);min-height:44px;padding:0 14px;border:2px solid var(--l);background:var(--d);font-size:15px;box-shadow:4px 4px 0 var(--d)}
#arrow.left{left:max(10px,env(safe-area-inset-left,0px))}
#arrow.right{right:max(10px,env(safe-area-inset-right,0px))}
#tag{position:fixed;z-index:8;pointer-events:none;font-size:13px;background:var(--l);color:var(--d);padding:2px 8px;white-space:nowrap}
#flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:var(--l);mix-blend-mode:difference;opacity:0}
#flash.go{animation:flash 1s steps(1,end)}
@keyframes flash{0%{opacity:0}3%{opacity:1}6%{opacity:0}11%{opacity:1}13%{opacity:0}}
#flatdeck{display:none}
body.flat #flatdeck{position:fixed;z-index:4;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--d);border-top:2px solid var(--l)}
body.flat #flatdeck button{min-height:48px;border:2px solid var(--l);background:var(--d);font-size:16px}
body.flat #flatdeck button.next{background:var(--l);color:var(--d)}
body.flat #sub,body.flat #choices{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}

/* sheets */
#sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background-image:repeating-conic-gradient(var(--d) 0 25%,transparent 0 50%);background-size:4px 4px}
.sheetcard{width:100%;max-width:760px;max-height:88%;overflow-y:auto;background:var(--d);border:2px solid var(--l);border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));-webkit-user-select:text;user-select:text}
.sheetcard h2{font:600 22px/1.2 var(--serif);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--l)}
.sheetcard h2 span{font:13px var(--sans)}
.hint{display:block;font-size:13px;margin:0 0 10px}
.rd{list-style:none;margin:0 0 10px;padding:0}
.rd li{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--l)}
.rd .z{font-weight:700}
.rd .x{font-size:13.5px;line-height:1.5}
.tg{min-width:4.4em;min-height:44px;border:2px solid var(--l);font-size:15px}
.tg.s-r{background:var(--l);color:var(--d)}
.tg.s-s{background:var(--l);color:var(--d);letter-spacing:.2em;border-style:dashed;outline:2px solid var(--d);outline-offset:-6px}
.tg.s-x{background:var(--d);text-decoration:line-through}
.rd-sp{font-size:13.5px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row button,.t-btns button{min-height:46px;padding:0 18px;border:2px solid var(--l);background:var(--d);font-size:16px}
.row .primary,.t-btns .primary{background:var(--l);color:var(--d);font-weight:500}
textarea{width:100%;font:16px/1.7 var(--hand);color:var(--d);background:var(--l);border:2px solid var(--l);padding:10px 12px;resize:vertical;-webkit-user-select:text;user-select:text}
.lg-list{list-style:none;padding:0;margin:16px 0 0;font:15px/1.7 var(--hand)}
.lgp{list-style:none;padding:12px 14px;margin:0 0 12px;background:var(--l);color:var(--d);background-image:repeating-linear-gradient(transparent 0 33px,color-mix(in srgb,var(--d) 35%,transparent) 33px 34px);font:16px/34px var(--hand)}
.lgp li{padding:0}
.lgp.prev{opacity:.86;font-size:15px}
.lgp .hint{font:13px/34px var(--sans);margin:0}
.ck{cursor:pointer;padding:1px 3px;margin-right:.55em;border:2px solid transparent;border-radius:48% 52% 46% 54% / 60% 44% 56% 40%;-webkit-user-select:none;user-select:none}
.ck:hover{border-color:color-mix(in srgb,#b3261e 35%,transparent)}
.ck.on{border-color:#b3261e;color:#7d140e;border-style:dashed}
.ck.on.lock{border-style:solid}
.ck.sel{background:color-mix(in srgb,#b3261e 14%,transparent)}
.ck sup{font:11px/1 var(--sans);color:#b3261e;margin-left:2px;vertical-align:super}
.slots{list-style:none;padding:6px 14px;margin:0 0 12px;background:var(--l);color:var(--d);font:15px/1.6 var(--hand);border:2px solid var(--l)}
.slots li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--d) 45%,transparent)}
.slots li:last-child{border-bottom:0}
.slots b{font:600 15px var(--serif)}
.slots .cnt{grid-column:3;color:#b3261e;letter-spacing:.2em}
.slots li.unk b{letter-spacing:.2em;opacity:.45}
.slots .seal-s{grid-column:3;font:600 13px/1 var(--serif);font-style:normal;color:#c4382a;border:2px solid #c4382a;padding:2px 3px;transform:rotate(-8deg)}
.slots p,.slots small{grid-column:1/-1;margin:0}
.slots small{font:12px var(--sans);opacity:.75}
.picker{position:sticky;bottom:0;margin:0 -16px;padding:10px 16px 12px;background:var(--d);border-top:2px solid var(--l);z-index:2}
.picker p{margin:0 0 8px;font-size:14px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{min-height:40px;padding:4px 12px;border:2px solid var(--l);background:var(--d);font-size:14px}
.pk button[aria-pressed=true],.pk button:active{background:#b3261e;border-color:#b3261e;color:#fff}
.lgh{font:600 14px var(--sans);margin:14px 0 6px;display:flex;justify-content:space-between;gap:8px}
.lgh span{font-weight:400}
.ink{float:right;color:#d04a3a;letter-spacing:.2em;font-weight:400}
.lgi{list-style:none;padding:0;margin:0 0 6px;font:15px/1.7 var(--hand)}
.lgi li{padding:4px 0;border-top:1px dashed var(--l)}
.lgi span{font:12px var(--sans);margin-right:.8em}
.lgi li::after{content:"核";float:right;color:#d04a3a;border:1.5px solid #d04a3a;font:12px/1 var(--serif);padding:2px 3px;transform:rotate(-8deg)}
.fx-rows li.zh .x,.rd li.zh .x{opacity:.55}
.opt.dump{border-color:#d04a3a;color:#ffd9d2;text-align:center;font-size:20px;letter-spacing:.4em}
.opt.dump:hover,.opt.dump:active{background:#d04a3a;color:var(--l)}
.dbar{display:block;height:4px;background:#d04a3a;transform-origin:left;animation:dbar linear forwards}
@keyframes dbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.lg-list li{padding:6px 0;border-top:1px dashed var(--l)}
.lg-list span{display:block;font:13px var(--sans)}
.sheetcard .note{margin:6px 0 14px;box-shadow:none;outline:0}
.memo{background:var(--l);color:var(--d);padding:16px 18px;font-size:15px;line-height:1.75}
.memo h3{margin:0;font:600 17px var(--serif);text-align:center}
.memo h3 + h3{margin-bottom:10px;font-size:20px}
.memo p{margin:0 0 4px;padding-left:2em;text-indent:-2em}
.opsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}

    const gain = fresh.length * 10 + tri.reduce((a, o) => a + (TRUTH.includes(o.c) ? 4 : 1), 0);

    dT(-4);
    dV(gain);

}

const lineAt = k => k[0] === "e" ? (S.ent[+k.slice(1)] || {}).s : (T.prev[+k.slice(1).split(".")[0]] || [])[+k.split(".")[1]];

  const n = S.night;

  S.okl.filter(l => l.n === n).forEach(l => { const s = lineAt(l.k); if (s && chunks(s).some(c => c.c)) bad++; else good++; });
  S.circ.filter(c => c.n === n).forEach(c => { const ch = chunkAt(c.k); if (!ch || ch.c !== c.s) wrong++; });
  if (!good && !bad && !wrong) return;

/* ---------- ending ---------- */
// what you know (能見度) against how close you let him come (信任)
function scoreC() {

}
function ending(dis) {
  S.ended = true; S.pend = null;

  const hiV = S.V >= 50, hiT = S.T >= 60;

  push({ k: "endmark" });

  } else p(E.noLog);
  p(fill(E.slotsN, { F: zh(F) }));
  if (R) p(fill(E.r, { R: zh(R) }));
  if (S.aired) p(E.aired);
  else if (S.cut) p(E.cutOnly);
  if (S.f.req === "yes") p(E.reqYes);
  if (S.f.req === "no") p(E.reqNo);
  if (S.f.oldPlayed && seed !== "monitor" && seed !== "deadfreq") p(E.oldSong);
  if (S.songs.length) p(fill(E.lastSong, { t: S.songs[S.songs.length - 1] }));
  E.seeds[seed].forEach(x => p(x === "{drawer}" ? (S.f.drawer ? E.drawerYes : E.drawerNo) : x));
  if (seed === "bright" && S.slots.name) p(E.name);
  if (dis || S.M < 20) p(fill(E.unreliable, { time: sayTime(S.tStop || S.t) }));
  p(E.after);
  push({ k: "restart" });
  S.endSeed = seed;
}

/* ---------- turn plumbing ---------- */
const FN = { sync: cSync, connect: cConnect, letter: cLetter, receive: cReceive, read: cRead, verify: cVerify, playback: cPlayback, cue: cCue, signoff: cSignoff };
function begin() { S.mark = S.blocks.length; S.turn++; S.tn.ev = false; return S.t; }
function tex(c) {
  if (S.night < 2 || S.tn.ev) return;
  const tr = tier();
  if (tr === "clear") return;
  const P = T.tex[tr];
  const pool = (P[c] || []).concat(P.amb).filter(x => !S.tn.tex.includes(x));
  if (!pool.length || rnd() < 0.4) return;
  const x = pick(pool);
  S.tn.tex.push(x);
  const s = fill(x, { sky: T.sky[S.night] });
  let i = S.blocks.length - 1;
  while (i >= S.mark && (S.blocks[i].k === "m" || S.blocks[i].k === "fx")) i--;
  if (i >= S.mark && S.blocks[i].k === "p") S.blocks[i].t += s; else p(s);
  const f = texFx(x);
  if (f) snd(f[0], f[1]);
}
function texFx(x) {
  const X = T.tex;
  if (x === X.murky.cue[0] || x === X.murky.playback[0]) return ["murmur", {}];
  if (x === X.tideline.cue[0] || x === X.tideline.playback[0]) return ["surf", { where: "monitor" }];
  if (x === X.tideline.connect[0] || x === X.tideline.verify[0]) return ["surf", { where: "phone" }];
  if (X.tideline.amb.includes(x)) return ["surf", { where: "room" }];
  return null;
}
function after(c, t0, n0) {

  /* ---------- the sequence: sound, camera, then a line of text at a time ---------- */

    if (b.dataset.v && b.closest("#choices")) { clearTimeout(dumpT); $("#choices").hidden = true; choose(b.dataset.v); return; }
    if (b.dataset.c) { doCmd(b.dataset.c); return; }
    if (b.id === "t-new" || b.id === "again") newGame();
    else if (b.id === "t-cont") { $("#title").hidden = true; document.body.classList.remove("titled"); if (has3d) Booth.title(false); commit(true); }
    else if (b.id === "t-memo") showMemo();
    else if (b.id === "snd") { SFX.setOn(!SFX.on()); if (SFX.on() && S) SFX.scene(room()); sndLabel(); }
    else if (b.id === "logbtn" || b.id === "readall") { if (S) showTranscript(); }
    else if (b.id === "opsbtn") { if (S) showOps(); }
    else if (b.id === "goal") { if (goalNow && goalNow.id && has3d) Booth.focus(goalNow.id); }
    else if (b.id === "arrow") { if (goalNow && goalNow.id && has3d) Booth.focus(goalNow.id); }
  });
  sheet().addEventListener("click", e => { if (e.target === sheet() && !(S && S.pend && S.pend.id === "read")) { closeSheet(); if (S) refresh(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !sheet().hidden && !(S && S.pend && S.pend.id === "read")) closeSheet();
    if ((e.key === " " || e.key === "Enter") && busy && waitTap && sheet().hidden) { e.preventDefault(); waitTap(); }
  });

  /* ---------- the 3D booth, or a flat fallback ---------- */
  has3d = !!(Booth.ok && Booth.init($("#gl")));
  applyPal(pal);
  if (!has3d) {
    document.body.classList.add("flat");
    $("#flatdeck").innerHTML = CMDS.map(([k, l]) => `<button type="button" data-c="${k}">${l}</button>`).join("");
  } else {
    Booth.motion(motion);
    Booth.level(() => SFX.level(), () => SFX.live());
    let lock = 0;
    Booth.onPick((id, x, y) => {
      if (!S || !$("#title").hidden) return;
      if (busy) { if (waitTap) waitTap(); return; }
      if (S.pend || performance.now() < lock) return;
      ripple(x, y);
      if (!id) { hideLook(); return; }
      Booth.poke(id);
      SFX.tap(TAP[id] || "plastic", Math.max(-0.8, Math.min(0.8, (x / innerWidth) * 2 - 1)));
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (err) { /* not supported */ }
      const c = act(id);
      if (c) { lock = performance.now() + 450; hideLook(); setTimeout(() => doCmd(c), 170); return; }
      lookAt(id);
    });
    Booth.onHover(() => { $("#tag").hidden = true; });
  }
  const TAP = { window: "glass", fan: "fan", clock: "tick", ac: "plastic", basin: "metal", lamp: "plastic", meters: "glass", onair: "buzz", ashtray: "glass", calendar: "paper", drawer: "wood", console: "plastic", shelf: "paper", reels: "plastic", notice: "paper", puddle: "water", phone: "plastic", board: "plastic", tray: "paper", fax: "plastic", mic: "thump", deck: "plastic", phones: "plastic", book: "paper" };
  const lookN = {};
  let lookTimer = 0;
  function lookAt(id) {
    const L = T.look[id], name = T.labels[id] || "";
    if (!L) return;
    const tr = tier(), n = S.night, i = (lookN[id] = (lookN[id] || 0) + 1);
    let pool = null;
    if (id === "onair") pool = tr === "tideline" && i % 2 ? L.tideline : (S.opened && !S.ended ? L.on : L.off);
    else if (id === "drawer" && S.f.drawer) pool = L.after;
    else if (id === "window" && S.ended) pool = L.dawn;
    else if (tr !== "clear" && L[tr] && i % 2 === 1) pool = L[tr];
    else if (L.n && L.n[n] && i % 3 !== 0) pool = L.n[n];
    if (!pool) pool = L.base || L.off;
    showLook(name, fill(pool[Math.floor(i / 2) % pool.length], { time: sayTime(S.t), M: S.M, date: T.dates[n] }));
  }
  function showLook(name, text) {
    const sub = $("#sub");
    sub.hidden = false; sub.className = "amb look";
    $("#sub-who").textContent = "";
    $("#sub-t").textContent = text;
    $("#sub-more").hidden = true;
    clearTimeout(lookTimer);
    lookTimer = setTimeout(hideLook, 2600 + [...text].length * 70);
  }
  function hideLook() { clearTimeout(lookTimer); if (!busy && S && !S.ended) $("#sub").hidden = true; }
  function ripple(x, y) {
    const r = document.createElement("i");
    r.className = "ripple";
    r.style.left = x + "px"; r.style.top = y + "px";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }
  let tagTimer = 0;
  function tag(text, x, y, ms) {
    const t = $("#tag");
    t.textContent = text;
    t.style.left = Math.min(innerWidth - 140, Math.max(8, x + 14)) + "px";
    t.style.top = Math.max(8, y - 34) + "px";
    t.hidden = false;
    clearTimeout(tagTimer);
    if (ms) tagTimer = setTimeout(() => { t.hidden = true; }, ms);
  }
  // arrow toward the next thing when it is off screen
  function arrowLoop() {
    requestAnimationFrame(arrowLoop);
    const a = $("#arrow");
    if (!has3d || !S || busy || S.pend || !goalNow || !goalNow.id || !$("#title").hidden) { a.hidden = true; return; }
    const p = Booth.project(goalNow.id);
    if (!p || p.on) { a.hidden = true; return; }
    a.hidden = false;
    a.className = p.dx < 0 ? "left" : "right";
    a.textContent = p.dx < 0 ? "‹ " + OBJ_NAME[goalNow.id] : OBJ_NAME[goalNow.id] + " ›";
  }
  requestAnimationFrame(arrowLoop);

  // weather: lightning on the fourth night, the island at the edge of sight
  let nextThunder = 0, nextPeek = 0;
  setInterval(() => {
    if (!S || S.ended || document.hidden || !$("#title").hidden) return;
    const t = performance.now(), tr = tier();
    if (S.night === 4) {
      if (!nextThunder) nextThunder = t + 5000 + Math.random() * 8000;
      else if (t > nextThunder) {
        if (motion) { const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); if (has3d) Booth.flash(); }
        SFX.thunder(0.8 + Math.random() * 2.4);
        nextThunder = t + 18000 + Math.random() * 24000;
      }
    } else nextThunder = 0;
    if ((tr === "murky" || tr === "tideline") && S.night >= 2) {
      if (!nextPeek) nextPeek = t + 20000;
      else if (t > nextPeek) { if (has3d) Booth.peek(); nextPeek = t + 45000 + Math.random() * 40000; }
    } else nextPeek = 0;
    if (!busy) { syncBooth(); bookPage(); if (errLevel() >= 3) wxStrip(); }
  }, 1000);

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => S || {});
  const start = data => {
    S = data && data.v ? data : load();
    if (S && !S.started) S = null;
    sndLabel();
    if (S) { renderHUD(); syncBooth(); bookPage(); }
    titleScreen();
  };
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}
}

document.getElementById("t-intro").textContent = TEXT.intro;
</script>
</body>
